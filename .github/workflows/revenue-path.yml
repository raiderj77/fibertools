name: FiberTools Revenue Path

on:
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fibertools-revenue-path
  cancel-in-progress: true

jobs:
  production-check:
    name: Verify production monetization paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check rendered production pages
        run: node scripts/revenue-path-check.js
