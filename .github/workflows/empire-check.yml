name: Portfolio Compliance Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install, test, and build
        run: |
          npm ci
          npm run test:quality
          npm run test:affiliate
          npm run test:indexnow
          npm run test:pattern-checker
          npm run test:revenue-path
          npm run test:stitchproof-distribution
          npm run test:seo-content-accuracy
          npm run test:legacy-search-redirects
          npm run test:ui-accessibility
          npm run test:calculator-math
          npm run test:privacy
          npm run test:cmp
          npm run test:strict-csp
          npm run test:security
          npm run build
          npm run check:csp-build-mode

  nonce-csp-spike:
    name: Report-only nonce CSP build and runtime
    runs-on: ubuntu-latest
    env:
      FIBERTOOLS_NONCE_CSP_MODE: report-only
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install, test, and build report-only mode
        run: |
          npm ci
          npm run test:strict-csp
          npm run build
          npm run check:csp-build-mode
      - name: Verify fresh runtime nonces and cache boundaries
        shell: bash
        run: |
          node node_modules/next/dist/bin/next start -p 3415 > nonce-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for ATTEMPT in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3415/ > /dev/null; then
              break
            fi
            if [ "$ATTEMPT" -eq 30 ]; then
              cat nonce-server.log
              exit 1
            fi
            sleep 1
          done
          npm run check:strict-csp-runtime -- http://127.0.0.1:3415

  compliance:
    name: Public-file compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required public files exist
        shell: bash
        run: |
          FAILED=0
          for STEM in ads robots llms; do
            if [ -f "public/${STEM}.txt" ] || [ -f "${STEM}.txt" ]; then
              echo "Found ${STEM}.txt"
            else
              echo "::error::Missing ${STEM}.txt"
              FAILED=1
            fi
          done
          [ "$FAILED" -eq 0 ] || exit 1

      - name: AdSense publisher ID is authorized
        shell: bash
        run: |
          ADS_FILE=""
          if [ -f public/ads.txt ]; then ADS_FILE="public/ads.txt"; fi
          if [ -z "$ADS_FILE" ] && [ -f ads.txt ]; then ADS_FILE="ads.txt"; fi
          grep -qF "pub-7171402107622932" "$ADS_FILE"

      - name: Search crawler directives are explicit
        shell: bash
        run: |
          ROBOTS_FILE=""
          if [ -f public/robots.txt ]; then ROBOTS_FILE="public/robots.txt"; fi
          if [ -z "$ROBOTS_FILE" ] && [ -f robots.txt ]; then ROBOTS_FILE="robots.txt"; fi
          grep -q "^User-agent: \*" "$ROBOTS_FILE"
          grep -q "^Sitemap: https://fibertools.app/sitemap.xml" "$ROBOTS_FILE"

      - name: IndexNow key file exists
        shell: bash
        run: |
          KEY_FILE=$(find public . -maxdepth 1 -type f -name "*.txt" 2>/dev/null | grep -E '/[0-9a-f]{32}\.txt$' | head -n 1 || true)
          if [ -z "$KEY_FILE" ]; then
            echo "::error::No IndexNow key file found"
            exit 1
          fi
