<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6b8e6d" />
    <title>FiberTools is offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f3e9;
        color: #332b25;
        font: 1rem/1.5 system-ui, sans-serif;
      }
      main {
        width: min(34rem, calc(100% - 2rem));
        padding: 2rem;
        border: 1px solid #c9c1b5;
        border-radius: 1rem;
        background: #fffdf8;
        box-sizing: border-box;
      }
      h1 {
        margin-top: 0;
      }
      a {
        color: #476b4b;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        FiberTools could not reach the requested page. Reconnect and try again.
        Pages saved by the normal static mode remain available from your browser.
      </p>
      <p><a href="/">Try the FiberTools home page</a></p>
    </main>
  </body>
</html>
