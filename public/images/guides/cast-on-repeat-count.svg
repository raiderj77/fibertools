<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Three six-stitch repeats total eighteen stitches</title><desc id="desc">Hypothetical raw requirement 12.2 stitches; two repeats provide only 12, while three provide 18. Circles are count symbols, not physical stitches.</desc><rect width="1200" height="760" fill="#faf7ef"/><g font-family="Arial,sans-serif" fill="#253d32"><text x="60" y="65" font-size="18" letter-spacing="2">FIBERTOOLS · COUNTING EXAMPLE</text><text x="60" y="125" font-size="38" font-weight="bold">Check the repeat and the resulting width</text><text x="60" y="174" font-size="23">12.2 in × (4 stitches ÷ 4 in) = 12.2 raw stitches</text><text x="60" y="217" font-size="22">Repeat requirement: a multiple of 6. Round up from the raw count.</text><rect x="60" y="257" width="330" height="160" rx="14" fill="#e5eddf"/><rect x="420" y="257" width="330" height="160" rx="14" fill="#e5eddf"/><rect x="780" y="257" width="330" height="160" rx="14" fill="#e5eddf"/><text x="85" y="295" font-size="21">Repeat 1</text><text x="445" y="295" font-size="21">Repeat 2</text><text x="805" y="295" font-size="21">Repeat 3</text><circle cx="100" cy="335" r="19" fill="#365b45"/><text x="100" y="342" text-anchor="middle" fill="white" font-size="18">1</text><circle cx="148" cy="335" r="19" fill="#365b45"/><text x="148" y="342" text-anchor="middle" fill="white" font-size="18">2</text><circle cx="196" cy="335" r="19" fill="#365b45"/><text x="196" y="342" text-anchor="middle" fill="white" font-size="18">3</text><circle cx="244" cy="335" r="19" fill="#365b45"/><text x="244" y="342" text-anchor="middle" fill="white" font-size="18">4</text><circle cx="292" cy="335" r="19" fill="#365b45"/><text x="292" y="342" text-anchor="middle" fill="white" font-size="18">5</text><circle cx="340" cy="335" r="19" fill="#365b45"/><text x="340" y="342" text-anchor="middle" fill="white" font-size="18">6</text><circle cx="460" cy="335" r="19" fill="#365b45"/><text x="460" y="342" text-anchor="middle" fill="white" font-size="18">7</text><circle cx="508" cy="335" r="19" fill="#365b45"/><text x="508" y="342" text-anchor="middle" fill="white" font-size="18">8</text><circle cx="556" cy="335" r="19" fill="#365b45"/><text x="556" y="342" text-anchor="middle" fill="white" font-size="18">9</text><circle cx="604" cy="335" r="19" fill="#365b45"/><text x="604" y="342" text-anchor="middle" fill="white" font-size="18">10</text><circle cx="652" cy="335" r="19" fill="#365b45"/><text x="652" y="342" text-anchor="middle" fill="white" font-size="18">11</text><circle cx="700" cy="335" r="19" fill="#365b45"/><text x="700" y="342" text-anchor="middle" fill="white" font-size="18">12</text><circle cx="820" cy="335" r="19" fill="#365b45"/><text x="820" y="342" text-anchor="middle" fill="white" font-size="18">13</text><circle cx="868" cy="335" r="19" fill="#365b45"/><text x="868" y="342" text-anchor="middle" fill="white" font-size="18">14</text><circle cx="916" cy="335" r="19" fill="#365b45"/><text x="916" y="342" text-anchor="middle" fill="white" font-size="18">15</text><circle cx="964" cy="335" r="19" fill="#365b45"/><text x="964" y="342" text-anchor="middle" fill="white" font-size="18">16</text><circle cx="1012" cy="335" r="19" fill="#365b45"/><text x="1012" y="342" text-anchor="middle" fill="white" font-size="18">17</text><circle cx="1060" cy="335" r="19" fill="#365b45"/><text x="1060" y="342" text-anchor="middle" fill="white" font-size="18">18</text><text x="85" y="390" font-size="21">6 stitches</text><text x="445" y="390" font-size="21">6 stitches</text><text x="805" y="390" font-size="21">6 stitches</text><text x="60" y="471" font-size="25">2 repeats = 12 stitches → below 12.2</text><text x="60" y="516" font-size="25" font-weight="bold">3 repeats = 18 stitches → next complete multiple</text><rect x="60" y="551" width="1080" height="93" rx="14" fill="#253d32"/><text x="85" y="591" fill="white" font-size="25">Modeled width: 18 ÷ 1 stitch per inch = 18 inches</text><text x="85" y="624" fill="white" font-size="20">That is 5.8 inches wider than the target. Check whether the design still works.</text><text x="60" y="691" font-size="19">Hypothetical arithmetic. Circles are count symbols, not knitted loops or technique instructions.</text><text x="60" y="725" font-size="19">No edge stitches or pattern offsets are included. Physical fit has not been tested.</text></g></svg>