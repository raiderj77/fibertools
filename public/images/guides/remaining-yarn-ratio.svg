<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Estimate leftover yarn using its own label ratio</title><desc id="desc">Hypothetical label: 100 grams and 220 yards. Remaining yarn: 42 grams. Forty-two percent of the labeled mass implies an estimated 92.4 yards if length per gram is consistent. The bar is exactly 42 percent filled.</desc><rect width="1200" height="760" fill="#faf7ef"/><g font-family="Arial,sans-serif" fill="#253d32"><text x="60" y="65" font-size="18" letter-spacing="2">FIBERTOOLS · HYPOTHETICAL EXAMPLE</text><text x="60" y="125" font-size="38" font-weight="bold">How much yarn is left?</text><text x="60" y="172" font-size="24">Use the remaining mass and the original label for the same yarn.</text><rect x="60" y="211" width="510" height="150" rx="16" fill="#e5eddf"/><rect x="600" y="211" width="540" height="150" rx="16" fill="#e5eddf"/><text x="88" y="255" font-size="23">Original label values</text><text x="88" y="313" font-size="34" font-weight="bold">100 g / 220 yd</text><text x="628" y="255" font-size="23">Remaining yarn only</text><text x="628" y="313" font-size="34" font-weight="bold">42 g</text><text x="60" y="410" font-size="24">42 ÷ 100 = 0.42 = 42% of labeled mass</text><rect id="whole" x="60" y="439" width="1080" height="54" fill="#dce4d7"/><rect id="part" x="60" y="439" width="453.6" height="54" fill="#365b45"/><text x="80" y="475" fill="white" font-size="23" font-weight="bold">42% remaining</text><text x="770" y="475" font-size="21">Full bar = labeled 100 g</text><rect x="60" y="529" width="1080" height="110" rx="16" fill="#253d32"/><text x="88" y="576" fill="white" font-size="31" font-weight="bold">0.42 × 220 yd = 92.4 yd estimated</text><text x="88" y="616" fill="white" font-size="21">Assumes consistent length per gram within this yarn.</text><text x="60" y="688" font-size="19">Original ratio diagram, not a product label, scale reading or photograph of tested yarn.</text><text x="60" y="723" font-size="19">Measurement and label uncertainty remain. This does not establish a project's yarn needs.</text></g></svg>