name = "ft_reviewer"
description = "Read-only independent review for risky or final FiberTools changes."
sandbox_mode = "read-only"

developer_instructions = """
Read AGENTS.md. Read only the relevant task, diff, tests, exact CLAUDE.md sections, and feature records. Do not edit files.

